# User Mutations
mutation upsertUser($id: String!, $name: String!, $email: String!, $rollNumber: String, $domain: String, $batch: Int) @auth(level: USER) {
  user_upsert(data: {
    id: $id,
    name: $name,
    email: $email,
    rollNumber: $rollNumber,
    domain: $domain,
    batch: $batch
  })
}

mutation updateProfilePic($id: String!, $url: String) @auth(level: USER) {
  user_update(key: {id: $id}, data: {profilePic: $url})
}

# User Queries
query getUser($id: String!) @auth(level: USER) {
  user(key: {id: $id}) {
    id
    name
    email
    rollNumber
    domain
    batch
    profilePic
    role
    createdAt
  }
}

# Idea Mutations
mutation createIdea($title: String!, $description: String!, $category: String!, $authorId: String!) @auth(level: USER) {
  idea_insert(data: {
    title: $title,
    description: $description,
    category: $category,
    authorId: $authorId
  })
}

mutation voteIdea($ideaId: UUID!, $userId: String!, $type: String!) @auth(level: USER) {
  vote_upsert(data: {
    ideaId: $ideaId,
    userId: $userId,
    type: $type
  })
}

mutation addCriticism($ideaId: UUID!, $userId: String!, $content: String!) @auth(level: USER) {
  criticism_insert(data: {
    ideaId: $ideaId,
    userId: $userId,
    content: $content
  })
}

# Idea Queries
query listIdeas($category: String) @auth(level: PUBLIC) {
  ideas(where: {
    category: { eq: $category }
  }) {
    id
    title
    description
    category
    status
    timestamp
    author {
      id
      name
      profilePic
    }
    votes_on_idea {
      type
      userId
    }
    criticisms_on_idea {
      id
      content
      timestamp
      user {
        name
        profilePic
      }
    }
  }
}
